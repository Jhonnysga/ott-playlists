name: Actualizar playlist BéisbolPlay

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generar beisbol.otc
        run: python3 .github/scripts/gen_beisbol.py
      - name: Commit y push si cambió
        run: |
          git config user.name "Wally"
          git config user.email "wally@local"
          git add beisbol.otc
          git diff --staged --quiet || (git commit -m "Actualizar playlist BéisbolPlay" && git push)
